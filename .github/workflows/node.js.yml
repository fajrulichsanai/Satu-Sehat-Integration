name: Deploy NestJS to Staging VPS

on:
  push:
    branches:
      - development
      - dev-daffa

jobs:
  deploy:
    name: Deploy to Staging VPS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          S3_REGION: ${{ secrets.S3_REGION }}
          SATUSEHAT_ENVIRONMENT: ${{ secrets.SATUSEHAT_ENVIRONMENT }}
          SATUSEHAT_ORGANIZATION_ID: ${{ secrets.SATUSEHAT_ORGANIZATION_ID }}
          SATUSEHAT_CLIENT_ID: ${{ secrets.SATUSEHAT_CLIENT_ID }}
          SATUSEHAT_CLIENT_SECRET: ${{ secrets.SATUSEHAT_CLIENT_SECRET }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          envs: S3_ENDPOINT,S3_BUCKET,S3_ACCESS_KEY,S3_SECRET_KEY,S3_REGION,SATUSEHAT_ENVIRONMENT,SATUSEHAT_ORGANIZATION_ID,SATUSEHAT_CLIENT_ID,SATUSEHAT_CLIENT_SECRET
          script: |
            set -e

            echo "📁 Masuk ke direktori project..."
            cd ~/staging-apex-record/backend/Satu-Sehat-Integration

            echo "⬇️  Pull kode terbaru dari branch ${{ github.ref_name }}..."
            git fetch origin ${{ github.ref_name }}
            git checkout ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}

            echo "🔑 Sinkronkan kredensial S3 & SATUSEHAT ke .env (kalau di-set sebagai GitHub Secret)..."
            touch .env
            chmod 600 .env
            for KEY in S3_ENDPOINT S3_BUCKET S3_ACCESS_KEY S3_SECRET_KEY S3_REGION \
                       SATUSEHAT_ENVIRONMENT SATUSEHAT_ORGANIZATION_ID SATUSEHAT_CLIENT_ID SATUSEHAT_CLIENT_SECRET; do
              VALUE="${!KEY}"
              if [ -n "$VALUE" ]; then
                # Tanpa sed: nilai secret boleh berisi karakter apa pun (|, &, /)
                grep -v "^${KEY}=" .env > .env.tmp || true
                printf '%s=%s\n' "$KEY" "$VALUE" >> .env.tmp
                cat .env.tmp > .env && rm -f .env.tmp
              fi
            done

            echo "📦 Install dependencies..."
            npm install

            echo "🔨 Build project..."
            npm run build

            echo "🗄️  Jalankan repair schema paket langganan (one-off, aman diulang)..."
            node scripts/repair-subscription-plans.js || echo "⚠️  Repair script gagal, lanjut deploy — cek log di atas"

            echo "🔐 Terapkan skema keamanan (sesi, lockout, audit) — idempoten..."
            node scripts/apply-security-schema.js

            echo "🩺 Muat kode diagnosis ICD-10 & SNOMED CT (hanya bila datanya berubah)..."
            node scripts/seed-terminology.js || echo "⚠️  Seed terminologi gagal, lanjut deploy — pencarian diagnosis belum tersedia, cek log di atas"

            echo "♻️  Restart PM2..."
            pm2 restart apex-record-staging-backend

            echo "✅ Deploy selesai!"
