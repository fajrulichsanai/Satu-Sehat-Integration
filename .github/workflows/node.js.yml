name: Deploy NestJS to Staging VPS

on:
  push:
    branches:
      - development
      - dev-daffa

jobs:
  deploy:
    name: Deploy to Staging VPS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e

            echo "📁 Masuk ke direktori project..."
            cd ~/staging-apex-record/backend/Satu-Sehat-Integration

            echo "⬇️  Pull kode terbaru dari branch ${{ github.ref_name }}..."
            git fetch origin ${{ github.ref_name }}
            git checkout ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}

            echo "📦 Install dependencies..."
            npm install

            echo "🔨 Build project..."
            npm run build

            echo "🗄️  Jalankan repair schema paket langganan (one-off, aman diulang)..."
            node scripts/repair-subscription-plans.js || echo "⚠️  Repair script gagal, lanjut deploy — cek log di atas"

            echo "♻️  Restart PM2..."
            pm2 restart apex-record-staging-backend

            echo "✅ Deploy selesai!"
